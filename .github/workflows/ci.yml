name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  updater:
    name: Updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          - windows-11-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.1
          manifest-path: updater/pyproject.toml
          cache: true

      - name: Lint updater
        if: runner.os == 'Linux'
        run: pixi run --manifest-path updater/pyproject.toml --locked lint

      - name: Check updater formatting
        if: runner.os == 'Linux'
        run: pixi run --manifest-path updater/pyproject.toml --locked format-check

      - name: Test updater
        run: pixi run --manifest-path updater/pyproject.toml --locked test

  updater-package:
    name: Updater conda package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.1
          manifest-path: updater/pyproject.toml
          cache: true

      - name: Build updater conda package
        run: pixi run --manifest-path updater/pyproject.toml --locked build-conda-package
